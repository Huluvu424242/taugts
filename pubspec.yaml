name: taugts
description: Eine lokale Bewertungs-App für Dinge, die etwas taugen – oder eben nicht.
publish_to: none
version: 0.1.0+8

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  excel_community: ^2.3.0
  mobile_scanner: ^7.1.3
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  file_picker: ^10.3.3
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  sqlite3: ^3.1.3
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon_source.png
    - assets/badges/powered_by_ki.png
    - CHANGELOG.md
