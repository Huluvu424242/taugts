name: Dart-Formatierung Arbeitsbranch

# Ausschließlich manuell; vor dem ersten Einsatz gesonderte Freigabe gemäß AGENTS.md nötig.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Bestehender ungeschützter Arbeitsbranch (z. B. bug/234-json-schema-version-3)"
        required: true
        type: string
      expected_sha:
        description: "Optional: erwarteter SHA des Zielbranchs; bei Abweichung sicher abbrechen"
        required: false
        type: string

permissions: {}

concurrency:
  group: dart-format-branch-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  format-branch:
    # Workflow selbst ausschließlich von master starten. Zielbranch wird separat validiert.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Vertrauenswürdige Workflow-Quelle auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 1

      - name: Zielbranch und Ausgangs-SHA prüfen
        id: target
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Branchname gelangt ausschließlich über env in die Shell, niemals als
          # unverarbeitete Workflow-Expression in ein ausführbares Kommando.
          if [[ ! "$TARGET_BRANCH" =~ ^(story|bug|feature|fix|docs|chore)/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Nur Arbeitsbranches mit erlaubtem Präfix sind zulässig."
            exit 1
          fi
          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "::error::Ungültiger Git-Branchname."
            exit 1
          fi
          # Ausschließlich Branches desselben Repositorys abrufen.
          git fetch --no-tags --depth=1 origin             "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git checkout --detach "refs/remotes/origin/$TARGET_BRANCH"
          head_sha="$(git rev-parse HEAD)"
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$head_sha" ]]; then
            echo "::error::Der Arbeitsbranch entspricht nicht dem erwarteten SHA."
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          {
            echo "### Dart-Formatierung"
            echo "- Zielbranch: \`$TARGET_BRANCH\`"
            echo "- Ausgangs-SHA: \`$head_sha\`"
            echo "- Umfang: ausschließlich bestehende \`.dart\`-Dateien unter \`lib/\` und \`test/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flutter-SDK bereitstellen
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dart-Dateien formatieren und Änderungsumfang prüfen
        id: format
        shell: bash
        run: |
          set -euo pipefail
          # Keine Projektabhängigkeiten aus untrusted Arbeitsbranches ausführen.
          # dart format liest und formatiert nur Dart-Quelltext.
          dart format lib test
          if ! git diff --quiet -- lib test; then
            while IFS= read -r -d '' datei; do
              if [[ ! "$datei" =~ ^(lib|test)/.*\.dart$ ]]; then
                echo "::error::Formatierung hat unerlaubte Datei verändert: $datei"
                exit 1
              fi
            done < <(git diff --name-only -z)
            # Nur bereits versionierte Dart-Dateien erfassen.
            git add --update -- lib test
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              git diff --cached --check
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Genau einen Formatierungscommit erzeugen
        if: steps.format.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: Dart-Formatierung (automatisiert)"

      - name: Branchspitze prüfen und Formatierungscommit pushen
        if: steps.format.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Race-Check: Falls der Branch inzwischen bewegt wurde, nicht schreiben.
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Arbeitsbranch wurde zwischenzeitlich verändert; kein Push."
            exit 1
          fi
          # Token nur in diesem letzten Schritt verfügbar, nie beim Auschecken
          # oder beim Formatieren fremden Branch-Inhalts.
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization"             push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "- Ergebnis: genau ein Formatierungscommit auf \`$TARGET_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Unveränderter Arbeitsbranch
        if: steps.format.outputs.changed == 'false'
        run: echo "Keine Formatierungsänderungen erforderlich; kein Commit und kein Push."
