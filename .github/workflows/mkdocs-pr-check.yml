name: MkDocs-PR-Prüfung

on:
  pull_request:
    branches:
      - master
      - "release/**"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"

permissions: {}

concurrency:
  group: mkdocs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strict-build:
    name: Dokumentation strikt prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Dokumentationsabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check --requirement requirements-docs.txt

      - name: Links und Dokumentation strikt prüfen
        run: mkdocs build --strict
